<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threadline Clothing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    header {
      background-color: #111;
      color: white;
      padding: 2rem 1rem;
      width: 100%;
    }

    header h1 {
      font-size: 3rem;
      letter-spacing: 2px;
    }

    nav {
      margin-top: 1rem;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #aaa;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: white;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 4rem 2rem;
    }

    .hero-text {
      max-width: 600px;
    }

    .hero-text h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero-text p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    footer {
      background-color: #111;
      color: white;
      padding: 1rem;
      width: 100%;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Threadline Clothing</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>
  <main>
    <div class="hero-text">
      <h2>Wear Your Identity</h2>
      <p>
        At Threadline, we believe clothing is more than fabric—it's a statement. Discover minimalist fashion crafted for self-expression, comfort, and confidence.
      </p>
    </div>
  </main>
  <footer>
    &copy; 2025 Threadline Clothing. All rights reserved.
  </footer>
</body>
</html>
